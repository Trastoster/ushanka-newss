<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ушанка — новостной сайт">
    <title>Новости Ушанка</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1><b>Ушанка</b></h1>
        <input type="text" id="searchInput" placeholder="Поиск новостей" class="search-bar" name="">
        <nav>
            <ul class="menu">
                <li><a href="index.html"><b>Главная</b></a></li>
                <li><a href="about.html"><b>О нас</b></a></li>
                <li><a href="contact.html"><b>Контакты</b></a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <section id="newsList">
            <h1 class="lastnews">Последние новости:</h1>
            
            <!-- Я добавил класс "news-item" для каждой новости, чтобы скрипт знал, что именно прятать -->
            <h2 class="news-item"><a href="egoravsatcapc.html" class="lastnewss">Егор дал взятку Насте и поиграл в ПК</a></h2>
            <h2 class="news-item"><a href="ksushaliz.html" class="lastnewss">Ксюша лизнула себя</a></h2>
            <h2 class="news-item"><a href="nasaasu.html" class="lastnewss">Настя ест суши</a></h2>
            <h2 class="news-item"><a href="newsaegorapc.html" class="lastnewss">Егор не играет в ПК всю неделю</a></h2>
            
        </section>
        
        <!-- Текст, который появится, если ничего не найдено -->
        <p id="noResults" style="display: none; text-align: center; color: #888;">По вашему молодежному запросу ничего не найдено.</p>
    </main>

    <footer>
        <center><p>&copy; 2026 Новости "Ушанка"</p></center>
    </footer>

    <script>
        document.getElementById('searchInput').addEventListener('input', function(e) {
            let searchText = e.target.value.toLowerCase().trim(); 
            
            let newsItems = document.querySelectorAll('.news-item'); 
            let foundAny = false; 

            newsItems.forEach(function(item) {
                let title = item.textContent.toLowerCase(); 
                
                if (title.includes(searchText)) {
                    item.style.display = 'block'; 
                    foundAny = true; 
                } else {
                    item.style.display = 'none'; 
                }
            });

            let noResultsMsg = document.getElementById('noResults');
            if (!foundAny && searchText !== "") {
                noResultsMsg.style.display = 'block';
            } else {
                noResultsMsg.style.display = 'none';
            }
        });
    </script>
</body>
</html>
